name: Ballerina CI/CD Pipeline

on:
  push:
    paths:
      # 1. UPDATED: Trigger on changes within the new source directory
      - 'integration/airlineservice/**'
      - '.github/workflows/airline-api-pipeline.yml'
    branches:
      - dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    # Add environment variables for AKS configuration
    env:
      AKS_RESOURCE_GROUP: ${{ secrets.AKS_RESOURCE_GROUP }} # Azure Resource Group where the AKS cluster is
      AKS_DEV_CLUSTER_NAME: ${{ secrets.AKS_DEV_CLUSTER_NAME }}     # Name of the AKS cluster
      BALLERINA_NAMESPACE: ballerina 
      # 2. ADDED: Define the base path for Ballerina commands
      PROJECT_DIR: integration/airlineservice 

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: ⚙️ Debug - Print Environment Variables
        run: |
          echo "Current Working Directory: $(pwd)"
          echo "AKS_RESOURCE_GROUP: ${{ env.AKS_RESOURCE_GROUP }}"
          echo "AKS_DEV_CLUSTER_NAME: ${{ env.AKS_DEV_CLUSTER_NAME }}"
          echo "BALLERINA_NAMESPACE: ${{ env.BALLERINA_NAMESPACE }}"
          echo "PROJECT_DIR: ${{ env.PROJECT_DIR }}" # Debug new variable
        
      - name: Set up Ballerina
        uses: ballerina-platform/setup-ballerina@v1
        with:
          version: 2201.12.7

      - name: Cache Ballerina Dependencies
        uses: actions/cache@v3
        with:
          # Use the project directory to hash the Ballerina.toml
          path: ~/.ballerina
          key: ballerina-deps-${{ hashFiles('${{ env.PROJECT_DIR }}/Ballerina.toml') }}
          restore-keys: |
            ballerina-deps-

      - name: Run Tests
        # 3. UPDATED: Run bal test inside the project directory
        run: bal test --project ${{ env.PROJECT_DIR }}

      - name: Build Ballerina Project (Generates K8s artifacts)
        # 4. UPDATED: Run bal build inside the project directory
        run: bal build --project ${{ env.PROJECT_DIR }}

      # --- START DOCKER REGISTRY STEPS ---
      
      - name: 🔐 Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          
      - name: 📦 Push Docker Image to Registry
        run: |
          # Pushes the image tag defined in your Deployment manifest (airlineservice-deployment)
          IMAGE_NAME="ramilu90/airline-service:1.0.1"
          echo "Pushing image: ${IMAGE_NAME}"
          docker push ${IMAGE_NAME}

      # --- END DOCKER REGISTRY STEPS ---

      ## --- Azure Kubernetes Service (AKS) Deployment ---

      - name: 🔐 Azure Login via Service Principal
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
          enable-AzPSSession: true
          
      - name: 🚢 Set AKS Kubectl Context
        uses: azure/aks-set-context@v3
        with:
          resource-group: ${{ env.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ env.AKS_DEV_CLUSTER_NAME }}

      - name: 🚀 Ensure Namespace Exists (with Debug)
        run: |
          NAMESPACE="${{ env.BALLERINA_NAMESPACE }}"
          CREATE_COMMAND="kubectl create namespace ${NAMESPACE} --dry-run=client -o yaml | kubectl apply -f -"
          
          echo "Checking if namespace ${NAMESPACE} exists..."
          if kubectl get namespace ${NAMESPACE} > /dev/null 2>&1; then
            echo "Namespace ${NAMESPACE} already exists. Skipping creation."
          else
            echo "Namespace ${NAMESPACE} does not exist. Creating it now..."
            echo "Executing command: ${CREATE_COMMAND}"
            # Execute the command to create the namespace idempotently
            eval ${CREATE_COMMAND}
          fi
          
          # Final check to confirm creation status
          echo "--- Current Namespace Status ---"
          kubectl get namespace ${NAMESPACE}
          echo "--------------------------------"

      - name: 🔍 Debug - Check Working Directory and Files
        run: |
          # 5. UPDATED: The K8s artifacts are now nested one level deeper relative to the current working directory
          K8S_ARTIFACTS_DIR="${{ env.PROJECT_DIR }}/target/kubernetes/airlineservice"
          
          if [ -d "${K8S_ARTIFACTS_DIR}" ]; then
            echo "${K8S_ARTIFACTS_DIR} directory exists."
            echo "ls: "
            ls -la ${K8S_ARTIFACTS_DIR}
          else
            echo "${K8S_ARTIFACTS_DIR} directory does NOT exist"
            exit 1
          fi
          
      - name: Deploy Kubernetes Resources with kubectl
        # 6. UPDATED: Use the relative path to the generated K8s artifacts
        run: |
          K8S_DIR="${{ env.PROJECT_DIR }}/target/kubernetes/airlineservice"
          
          echo "Deleting existing resources from ${K8S_DIR}..."
          kubectl delete -f ${K8S_DIR} -n ${{ env.BALLERINA_NAMESPACE }}
          
          echo "Applying new resources from ${K8S_DIR}..."
          kubectl apply -f ${K8S_DIR} -n ${{ env.BALLERINA_NAMESPACE }}