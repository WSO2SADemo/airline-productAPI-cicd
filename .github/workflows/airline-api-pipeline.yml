name: WSO2 API CI/CD
on:
  push:
    paths:
      - 'AirlineProductAPI/**'
      - '.github/workflows/airline-api-pipeline.yml'
    branches:
      - dev

jobs:
  deploy-api-dev:
    runs-on: ubuntu-latest
    if: ${{ contains(github.event.head_commit.message, 'dev') || github.event_name == 'push' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Add etc/hosts entry for dev.airbus.am.wso2.com 🌐
        run: |
          # Format: IP Address    Hostname(s)
          # 'tee -a' appends the line to /etc/hosts using sudo privileges.
          echo '20.6.64.200 dev.airbus.am.wso2.com' | sudo tee -a /etc/hosts
          
          # Optional: Verify the entry
          echo "Hosts file content after addition:"
          cat /etc/hosts

      - name: Install apictl
        run: |
          wget https://github.com/wso2/product-apim-tooling/releases/download/v4.6.0/apictl-4.6.0-linux-amd64.tar.gz
          tar -xzf apictl-4.6.0-linux-amd64.tar.gz
          chmod +x apictl/apictl
          sudo mv apictl/apictl /usr/local/bin/

      - name: Add Dev Environment
        run: |
          apictl add env dev --apim https://${{ secrets.WSO2_DEV_APIM }}

      - name: Login to Dev
        run: |
          apictl login dev -u ${{ secrets.APIM_USERNAME }} -p ${{ secrets.APIM_PASSWORD }} --insecure

      - name: Import API to Dev
        run: |
          apictl import api -f AirlineProductAPI/ -e dev --preserve-provider=false --update --insecure

      - name: Wait for API Revision (10s Check) ⏳
        id: wait_for_api
        run: |
          API_NAME="AirlineProductAPI"
          API_VERSION="1.0.0"
          ENVIRONMENT="dev"
          MAX_WAIT_TIME=10  # Maximum time to wait (seconds)
          SLEEP_INTERVAL=2  # How often to check (seconds)
          ELAPSED_TIME=0
          echo "Waiting for API '${API_NAME}' revision to appear (max ${MAX_WAIT_TIME}s)..."
          
          # The loop checks for a successful output from get-api-revisions
          while [ ${ELAPSED_TIME} -lt ${MAX_WAIT_TIME} ]; do
              # The 'apictl get api-revisions' command will fail if the API isn't fully ready or if there are no revisions yet.
              # We use '|| true' to prevent the step from failing immediately.
              REVISION_OUTPUT=$(apictl get api-revisions -n ${API_NAME} -v ${API_VERSION} -e ${ENVIRONMENT} --insecure 2>&1)
              
              # Check if the output contains the expected API name (indicating success)
              if echo "${REVISION_OUTPUT}" | grep -q "${API_NAME}"; then
                  echo "API revision found after ${ELAPSED_TIME}s."
                  exit 0
              fi
              
              echo "Revisions not ready yet. Waiting ${SLEEP_INTERVAL}s..."
              sleep ${SLEEP_INTERVAL}
              ELAPSED_TIME=$((ELAPSED_TIME + SLEEP_INTERVAL))
          done
          
          # If the loop finishes without finding the revision, fail the step.
          echo "Error: API revision not found after ${MAX_WAIT_TIME} seconds."
          echo "Last output from apictl get api-revisions:"
          echo "${REVISION_OUTPUT}"
          exit 1

      - name: Publish API to Dev 🚀
        run: |
          apictl change-status api --action "Publish" --name AirlineProductAPI --version 1.0.0 --environment dev 

      - name: Run Tests (Optional)
        run: |
          apictl get apis -e dev --insecure | awk 'NR>1 {print}' | grep -E "AirlineProductAPI" || {
            echo "AirlineProductAPI not found in Publisher (dev)."
            exit 1
          }
          echo "AirlineProductAPI is present in Publisher (dev)"